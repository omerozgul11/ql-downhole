# Downhole Studio local test environment (NOT for production). Start with testenv/start.sh.
#   50010  Downhole Studio in the browser (noVNC)      50013  Files: reports, exports, test data, uploads
#   50011  Licence server API                          50014  Test mailbox (licence e-mails)
#   50012  Admin portal
# Secrets come from testenv/.env, generated by start.sh (git-ignored).
name: dhs-testenv

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dhs_licensing
      POSTGRES_USER: dhs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run start.sh}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhs -d dhs_licensing"]
      interval: 3s
      retries: 30

  license-server:
    image: dhs-testenv/license-server
    build: { context: .., dockerfile: server/Dockerfile, args: { APP: DownholeStudio.LicenseServer } }
    restart: unless-stopped
    # Same uid as the owner of the signing keys, which stay mode 600 in their folder.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Licensing: Host=postgres;Database=dhs_licensing;Username=dhs;Password=${POSTGRES_PASSWORD}
      Database__MigrateOnStartup: "true"
      Licensing__SigningKeyPath: /keys/license-signing-key.pem
      Updates__SigningKeyPath: /keys/update-signing-key.pem
      LICENSING_KEY_PEPPER: ${LICENSING_KEY_PEPPER:?run start.sh}
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      Smtp__StartTls: "false"
      Email__DownloadUrl: https://github.com/omerozgul11/ql-downhole/raw/main/download/DownholeStudio-Setup.exe
      Https__Redirect: "false"
    volumes: ["${SIGNING_KEYS_DIR:?run start.sh}:/keys:ro"]
    ports: ["0.0.0.0:50011:8080"]

  admin-portal:
    image: dhs-testenv/admin-portal
    build: { context: .., dockerfile: server/Dockerfile, args: { APP: DownholeStudio.AdminPortal } }
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy }, license-server: { condition: service_started } }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Licensing: Host=postgres;Database=dhs_licensing;Username=dhs;Password=${POSTGRES_PASSWORD}
      Database__MigrateOnStartup: "true"
      LICENSING_KEY_PEPPER: ${LICENSING_KEY_PEPPER}
      AdminPortal__AllowInsecureHttp: "true"   # plain HTTP on the local network for testing only
    ports: ["0.0.0.0:50012:8080"]

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ["0.0.0.0:50014:8025"]

  app:
    image: dhs-testenv/app
    build: { context: ../artifacts/testenv/context, dockerfile: testenv/app/Dockerfile }
    restart: unless-stopped
    hostname: dhs-test-pc
    depends_on: [license-server]
    environment:
      VNC_PASSWORD: ${VNC_PASSWORD:?run start.sh}
      LICENSE_SERVER_URL: http://license-server:8080/
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      - home:/home/tester
      - workspace:/home/tester/Downhole Studio
      - uploads:/home/tester/Uploads
      - ../artifacts/testenv/test-data:/home/tester/Test data:ro
    ports: ["0.0.0.0:50010:6080"]
    shm_size: 256m

  files:
    image: filebrowser/filebrowser:v2.32.0
    restart: unless-stopped
    user: "1000:1000"
    command: ["--root", "/srv", "--address", "0.0.0.0", "--port", "8080", "--database", "/database/filebrowser.db"]
    volumes:
      - workspace:/srv/Downhole Studio
      - uploads:/srv/Uploads
      - ../artifacts/testenv/test-data:/srv/Test data:ro
      - filebrowser:/database
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
    ports: ["0.0.0.0:50013:8080"]

  # One-shot: hands the shared volumes to the test user (uid 1000) before the services use them.
  init:
    image: busybox:1.37
    profiles: ["init"]
    user: root
    command: ["sh", "-c", "chown -R 1000:1000 /v"]
    volumes:
      - home:/v/home
      - workspace:/v/workspace
      - uploads:/v/uploads
      - filebrowser:/v/filebrowser

volumes:
  pgdata:
  home:
  workspace:
  uploads:
  filebrowser:
